name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows tests, audit and portable build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install pip==26.2.1 setuptools==84.0.0 wheel==0.48.0
      - run: python -m pip install -e ".[dev]" ruff==0.16.8 pip-audit==2.10.1
      - run: ruff check batch_renamer.py sequence_renamer scripts tests
      - run: ruff format --check batch_renamer.py sequence_renamer scripts tests
      - run: python -m pytest
      - run: python batch_renamer.py --smoke-test
      - run: python -m pip_audit --local --skip-editable
      - name: Build and smoke-test the portable application
        shell: powershell
        run: .\scripts\build_windows.ps1 -SkipInstaller
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: renamr-windows-portable
          path: artifacts/*/Renamr-*-win-x64-portable.zip

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan full history
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
