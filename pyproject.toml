[build-system]
requires = [
    "setuptools==84.0.0",
    "wheel==0.48.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "renamr"
version = "1.1.6"
description = "Renamr: safe, lightweight batch renaming for image sequences."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6==6.11.1",
]

[project.optional-dependencies]
build = [
    "PyInstaller==6.21.0",
]
test = [
    "pytest==9.1.1",
]
dev = [
    "PyInstaller==6.21.0",
    "pytest==9.1.1",
]

[project.gui-scripts]
renamr = "batch_renamer:main"

[tool.setuptools]
py-modules = ["batch_renamer"]

[tool.setuptools.package-data]
sequence_renamer = [
    "assets/*.svg",
    "assets/fonts/Inter-4.1/*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sequence_renamer*"]
exclude = ["packaging*", "scripts*", "tests*"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
